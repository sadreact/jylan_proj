<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #Hello-World-Box {
            background-color: #000000;
            color : linen;
            border: 2px solid #444444;
            padding: 2px;
            font-family:'Courier New', Courier, monospace;
        }
        #gameDiv {
            position: relative;
            border: 2px solid #000000;
            width: 500px;
            height: 500px;
        }
        .osusquare {
            position: absolute;
            background-color: aqua;
            border-radius: 50px;
            cursor: pointer;
            width: 50px;
            height: 50px;
        }
    </style>
  </head>
  <body>
        <div id="Hello-World-Box">Compiling...</div>
        
        <script>
            const box = document.getElementById('Hello-World-Box');
        </script>
        
        <button type = "button" id = "button">Click Me!</button>
        
        <script>
            const button = document.getElementById('button');
            const gameDiv = document.createElement('div');
            gameDiv.id = "gameDiv";
            
            button.addEventListener("click", function(){
                if(!document.body.querySelector('#gameDiv')){
                    document.body.appendChild(gameDiv);
                } else {
                    const square = document.createElement('button');
                    square.className = 'osusquare';
                    gameDiv.appendChild(square);
                    square.style.left = Math.floor(Math.random() * (gameDiv.offsetWidth - square.offsetWidth)) + 'px';
                    square.style.top = Math.floor(Math.random() * (gameDiv.offsetHeight - square.offsetHeight)) + 'px';
                    square.onclick = function(){
                        square.remove();
                    }
                    
                }
                
            })
        </script>
  </body>
</html>
